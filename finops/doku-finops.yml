meters:
- name: card_transactions
  description: Card acceptance MDR (percentage + flat fee) per successful card payment.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - channel
- name: virtual_account_transactions
  description: Flat per-transaction fee per Virtual Account settlement.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - bank
- name: qris_transactions
  description: QRIS regulated MDR (percentage) per successful QR payment.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
- name: ewallet_transactions
  description: e-Wallet MDR (percentage, varies by wallet) per successful debit.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - wallet
- name: payout_transactions
  description: Flat fee per Kirim disbursement to a recipient bank account.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - beneficiaryBank
principles:
- name: Visibility
  description: Reconcile DOKU Back Office settlement statements against internal orders; track MDR and flat fees per channel.
- name: Allocation
  description: Tag transactions by channel, merchant sub-account, and business unit; map settlement deductions to cost centers.
- name: Optimization
  description: Steer customers toward lower-MDR channels (Virtual Account, QRIS) where appropriate; batch payouts; monitor failed-transaction retries.
- name: Accountability
  description: Assign an owner for payment-cost review; monitor effective take rate and settlement timing monthly.
