publisherName: DOKU
serviceCategory: Payment Processing
billingModel:
  pricingCategory: Transaction-Based
  billingFrequency: Per-Transaction (netted at settlement)
  billingCurrency: IDR
  chargeCategories:
  - Usage
  - Tax
