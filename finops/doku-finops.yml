description: >-
  FinOps view of DOKU acceptance and disbursement costs. Unlike usage-metered
  API vendors, DOKU's cost is the per-transaction Merchant Discount Rate (MDR)
  deducted from settlement, plus flat per-transaction fees on some channels and
  per-disbursement fees on Kirim payout. All charges are in Indonesian Rupiah
  (IDR). Cost management is about channel mix (steering to lower-MDR channels
  like Virtual Account/QRIS vs. cards), settlement timing, and reconciliation.
notes: >-
  Channel MDRs and flat fees vary by merchant agreement and business category;
  verify against the DOKU Back Office statements. Currency is IDR.
sources:
- https://www.doku.com/en-us/products/payment-gateway
- https://developers.doku.com/
